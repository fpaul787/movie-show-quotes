<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Show Quotes API — Documentation</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.1/swagger-ui.css"
          integrity="sha384-4c3vsE5f+trhFyHrFrLM1fFGUn531NIaC7dcqEWIJdoRQJ5CkJbSuSCwXLpaS1KF"
          crossorigin="anonymous">
</head>
<body>
    <noscript>
        The interactive documentation needs JavaScript. The raw OpenAPI
        description is available at <a href="{% url 'api_v1:openapi' %}">{% url 'api_v1:openapi' %}</a>.
    </noscript>
    <div id="swagger-ui" data-schema-url="{% url 'api_v1:openapi' %}"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.1/swagger-ui-bundle.js"
            integrity="sha384-XFYN47VzPiDY6qPtxYKg0nqUeW/upo20xf1j2SUE7gT/i35FJB4cuS/71Iegzk8Z"
            crossorigin="anonymous"></script>
    <script>
        SwaggerUIBundle({
            url: document.getElementById("swagger-ui").dataset.schemaUrl,
            dom_id: "#swagger-ui",
            deepLinking: true,
            persistAuthorization: false,
        });
    </script>
</body>
</html>
