
services:
  db:
    image: postgres:17
    container_name: django-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: movie_show_quotes
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
